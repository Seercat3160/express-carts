name: release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0

      - name: Set up JDK25
        uses: actions/setup-java@v5.7.0
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: enhanced
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Build
        run: ./gradlew buildAndCollect -Ppublish.release=true

      - name: Release to Modrinth and GitHub
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishMods -Ppublish.release=true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: expresscarts-release
          path: build/libs/